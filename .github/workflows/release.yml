name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags (e.g., v1.0.0)

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build solution
      run: dotnet build OpenShotGolf.sln --configuration Release

    - name: Run all tests
      run: dotnet test OpenShotGolf.sln --configuration Release --no-build

    - name: Package addon
      run: |
        mkdir -p release
        cp -r addons/openfairway release/
        cd release
        zip -r openfairway-addon.zip openfairway/
        cd ..

    - name: Generate release notes
      id: release_notes
      run: |
        echo "## OpenFairway Physics Engine" > release_notes.md
        echo "" >> release_notes.md
        echo "Release ${GITHUB_REF#refs/tags/}" >> release_notes.md
        echo "" >> release_notes.md
        echo "### Installation" >> release_notes.md
        echo "1. Download \`openfairway-addon.zip\`" >> release_notes.md
        echo "2. Extract to your Godot project's \`addons/\` directory" >> release_notes.md
        echo "3. Enable the plugin in Project Settings > Plugins" >> release_notes.md
        echo "" >> release_notes.md
        echo "### Validated Shot Distances (as of this release)" >> release_notes.md
        echo "- **Chip**: 7.6/13.1 yd (target 13.0, error +0.8%)" >> release_notes.md
        echo "- **Bump**: 38.1/89.7 yd (target 85, error +5.5%)" >> release_notes.md
        echo "- **Wood**: 121.7/194.7 yd (target 198, error -1.7%)" >> release_notes.md
        echo "- **Approach**: 105.6/108.3 yd (target 108, error +0.3%)" >> release_notes.md
        echo "" >> release_notes.md
        echo "### Requirements" >> release_notes.md
        echo "- Godot 4.5+ (.NET build)" >> release_notes.md
        echo "- .NET 8.0 SDK" >> release_notes.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/openfairway-addon.zip
        body_path: release_notes.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
