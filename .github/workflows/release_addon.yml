name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Validate tag format
      run: |
        TAG="${{ inputs.tag }}"
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Error: Tag must match format v#.#.# (e.g. v1.0.0)"
          exit 1
        fi

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build solution
      run: dotnet build OpenFairway.csproj --configuration Release

    - name: Run CI tests
      run: |
        cd tests/PhysicsTests
        dotnet test --filter "Category=RolloutPhysics" --configuration Release

    - name: Package addon
      run: |
        cd addons
        zip -r "../OpenFairway_${{ inputs.tag }}.zip" openfairway/

    - name: Create tag
      run: |
        git tag "${{ inputs.tag }}"
        git push origin "${{ inputs.tag }}"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag }}
        name: OpenFairway ${{ inputs.tag }}
        files: OpenFairway_${{ inputs.tag }}.zip
        generate_release_notes: true
