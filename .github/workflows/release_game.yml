name: Release Game

on:
  push:
    tags:
      - 'game-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. game-v1.0.0)'
        required: true
        type: string

jobs:
  create-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_NAME: OpenFairway

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Resolve release tag
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          TAG="${{ inputs.tag }}"
        else
          TAG="${GITHUB_REF_NAME}"
        fi

        if [[ ! "$TAG" =~ ^game-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Error: Tag must match format game-v#.#.# (e.g. game-v1.0.0)"
          exit 1
        fi

        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git checkout "refs/tags/${TAG}"
            echo "Using existing tag ${TAG}."
          else
            echo "Tag ${TAG} does not exist yet; release will target current commit."
          fi
        fi

        echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
        echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Resolve project file
      run: |
        if [[ ! -f "OpenFairway.csproj" ]]; then
          echo "Error: OpenFairway.csproj was not found at the repository root."
          ls -la
          exit 1
        fi

        echo "PROJECT_FILE=OpenFairway.csproj" >> "$GITHUB_ENV"

    - name: Restore dependencies
      run: dotnet restore "${{ env.PROJECT_FILE }}"

    - name: Build editor assembly
      run: dotnet build "${{ env.PROJECT_FILE }}" --configuration Debug --no-restore

    - name: Build release assembly
      run: dotnet build "${{ env.PROJECT_FILE }}" --configuration Release --no-restore

    - name: Export Godot build
      id: export
      uses: firebelley/godot-export@v7.0.0
      with:
        godot_executable_download_url: https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=mono_linux_x86_64.zip&version=4.6.1
        godot_export_templates_download_url: https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=mono_export_templates.tpz&version=4.6.1
        relative_project_path: ./
        presets_to_export: Linux, Windows Desktop
        archive_output: true

    - name: Rename release archives
      run: |
        cd "${{ steps.export.outputs.archive_directory }}"
        ls -la

        linux_archive="$(find . -maxdepth 1 -type f -iname '*linux*.zip' -printf '%f\n' | head -n 1)"
        windows_archive="$(find . -maxdepth 1 -type f -iname '*windows*.zip' -printf '%f\n' | head -n 1)"

        if [[ -z "$linux_archive" || -z "$windows_archive" ]]; then
          echo "Error: Expected Linux and Windows zip archives after export."
          exit 1
        fi

        mv "$linux_archive" "${APP_NAME}_Linux.zip"
        mv "$windows_archive" "${APP_NAME}_Windows.zip"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        target_commitish: ${{ env.RELEASE_SHA }}
        name: ${{ env.APP_NAME }} Game ${{ env.RELEASE_TAG }}
        files: |
          ${{ steps.export.outputs.archive_directory }}/*
        generate_release_notes: true
